<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>Pelita</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mut:#66655f;--card:#fff;--line:#e2dfd6;--acc:#1f6f5c;--acc-bg:#e6f1ec;--me:#1f6f5c;--me-fg:#fff;--warn:#8a5200}
@media (prefers-color-scheme:dark){:root{--bg:#121311;--fg:#ebeae5;--mut:#a3a29b;--card:#1c1e1b;--line:#30332e;--acc:#62c3a6;--acc-bg:#1d2b26;--me:#2a6b5a;--me-fg:#fff;--warn:#e5a94f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Tamil","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:18px;color:var(--acc);margin-right:auto;display:flex;align-items:center;gap:6px}
.logo i{width:10px;height:10px;border-radius:50%;background:#f2a900;box-shadow:0 0 8px #f2a900}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acc-bg);color:var(--acc);white-space:nowrap}
.pill.off{background:#f6e7cf;color:var(--warn)}
select,input[type=search],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px}
select{padding:4px 6px;min-width:0;max-width:110px;flex:0 1 auto}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:10px 4px;border:0;background:none;font:inherit;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
main{flex:1;overflow-y:auto;padding:12px}
.msg{margin:0 0 10px;max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;background:var(--card);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--me);color:var(--me-fg);border-color:var(--me)}
.msg.note{background:none;border:1px dashed var(--line);color:var(--mut);font-size:14px}
.msg small{display:block;margin-top:6px;font-size:12px;opacity:.75}
.msg button.say{display:block;margin-top:6px;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--acc-bg);color:var(--acc);cursor:pointer}
form{background:var(--card);border-top:1px solid var(--line);padding:8px 10px}
.row{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;padding:10px;min-height:44px;max-height:120px}
.icon{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.icon.go{background:var(--acc);border-color:var(--acc);color:#fff}
.icon.rec{background:#c62828;color:#fff;border-color:#c62828}
.opts{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-top:6px}
#attach{font-size:13px;margin-bottom:6px;color:var(--acc)}
#attach button{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.card>button{width:100%;text-align:left;padding:12px;border:0;background:none;font:inherit;color:var(--fg);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.card .body{padding:0 12px 12px;white-space:pre-wrap}
.tag{font-size:12px;color:var(--mut)}
.k{font-weight:600;color:var(--acc);margin-top:8px;display:block}
.q{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.q button{font-size:13px;margin:4px 4px 0 0;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
.word{padding:8px 0;border-bottom:1px solid var(--line)}
.word b{color:var(--acc)}
input[type=search]{width:100%;padding:10px;margin-bottom:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <span class="logo"><i></i>Pelita</span>
  <span id="net" class="pill"></span>
  <span id="meter" class="pill" title="Data used">0 KB</span>
  <select id="lang" aria-label="Language"></select>
</header>
<nav role="tablist">
  <button role="tab" data-tab="chat" aria-selected="true" data-t="ask"></button>
  <button role="tab" data-tab="learn" aria-selected="false" data-t="lessons"></button>
  <button role="tab" data-tab="words" aria-selected="false" data-t="words"></button>
</nav>
<main id="chat"><div id="log" aria-live="polite"></div></main>
<main id="learn" hidden></main>
<main id="words" hidden><input type="search" id="find" aria-label="Search"><div id="wordlist"></div></main>
<form id="composer">
  <div id="attach" hidden></div>
  <div class="row">
    <label class="icon" id="photoBtn"><input type="file" id="photo" accept="image/*" capture="environment" hidden>&#128247;</label>
    <button type="button" class="icon" id="mic">&#127908;</button>
    <textarea id="text" rows="1"></textarea>
    <button class="icon go" id="send" aria-label="Send">&#10148;</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="saver"> <span data-t="saver"></span></label>
    <button type="button" id="newchat" class="pill" style="border:0;cursor:pointer">&#8635; <span data-t="newchat"></span></button>
  </div>
</form>
<script>

    en: ["Ask", "Lessons", "Words", "Type a question, or send a photo or voice note", "Data saver", "online", "offline", "Saved. It will be sent when you are back online.", "Listen", "Thinking…", "Recording… tap to stop", "Photo", "Voice note", "Hint", "Answer", "Hi! I'm Pelita. Ask me any maths, science or computer question in your language. Type it, snap a photo of your homework, or send a voice note.", "Could not reach the tutor. Your message is saved, try again.", "New topic", "Explain this to me", "Search a word"],

  function $(id) { return document.getElementById(id); }

      fd.append("audio", attachments.audio, "voice." + ext); up += attachments.audio.size;
    }
    var wait = bubble(t("thinking"), "note");
    fetch("/api/chat", {method: "POST", body: fd}).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      var down = +(r.headers.get("content-length") || 0);
      return r.json().then(function (j) { return [j, down]; });
    }).then(function (res) {
      var j = res[0], down = res[1] || new Blob([JSON.stringify(j)]).size;
      wait.parentNode.removeChild(wait);
      sessionId = j.session_id; store("sid", sessionId);
      meter(up + down);
      bubble(j.reply, "bot", "↑ " + kb(up) + "  ↓ " + kb(down));
      done(true);
    }).catch(function () {
      wait.parentNode.removeChild(wait);
      bubble(t(navigator.onLine === false ? "queued" : "error"), "note");
      done(false);
    });
  }

  function flush() {
    if (!queue.length || navigator.onLine === false) return;
    var item = queue[0];
    post(item, null, function (ok) { if (ok) { queue.shift(); saveQueue(); flush(); } });
  }

  $("composer").onsubmit = function (e) {
    e.preventDefault();
    var text = $("text").value.trim();
    if (!text && !pending.image && !pending.audio) return;
    var label = text; if (pending.image) label += (label ? "\n" : "") + "\u{1F4F7}"; if (pending.audio) label += (label ? " " : "") + "\u{1F3A4}";
    bubble(label, "me");
    $("text").value = ""; $("text").style.height = "";
    var att = {image: pending.image, audio: pending.audio}; pending.image = pending.audio = null; paintAttach();
    if (navigator.onLine === false && !att.image && !att.audio) { queue.push({text: text}); saveQueue(); bubble(t("queued"), "note"); return; }
    post({text: text}, att, function (ok) {
      if (!ok && !att.image && !att.audio) { queue.push({text: text}); saveQueue(); }
      if (!ok && (att.image || att.audio)) { pending = att; paintAttach(); }
    });
  };
  $("text").oninput = function () { this.style.height = ""; this.style.height = Math.min(this.scrollHeight, 120) + "px"; };
  $("text").onkeydown = function (e) { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(pointer:fine)").matches) { e.preventDefault(); $("send").click(); } };

  // ----- Offline lessons + glossary (cached by the service worker)
  function loadPack() {
    var l = lang === "auto" ? uiLang() : lang;
    fetch("/api/pack?lang=" + encodeURIComponent(l)).then(function (r) {
      var size = +(r.headers.get("content-length") || 0);
      return r.json().then(function (j) { return [j, size]; });
    }).then(function (res) {
      pack = res[0];
      var key = "packed." + l; if (!store(key) && res[1]) { meter(res[1]); store(key, "1"); }
      paintLessons(); paintWords();
    }).catch(function () {});
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  function paintLessons() {
    var root = $("learn"); root.innerHTML = "";
    pack.lessons.forEach(function (ls) {
      var card = el("div", "card"), head = el("button"), body = el("div", "body");
      head.type = "button"; head.appendChild(el("span", "", ls.title)); head.appendChild(el("span", "tag", ls.subject));
      body.hidden = true;
      head.onclick = function () { body.hidden = !body.hidden; };
      body.appendChild(el("span", "", ls.key_idea));
      if (ls.formula) { body.appendChild(el("span", "k", "Formula")); body.appendChild(el("span", "", ls.formula)); }
      body.appendChild(el("span", "k", "Example")); body.appendChild(el("span", "", ls.worked_example + "\n" + ls.example));
      body.appendChild(el("span", "k", "Common mistake")); body.appendChild(el("span", "", ls.common_mistake));
      var words = ls.terms.map(function (p) { return p[1] ? p[1] + " (" + p[0] + ")" : p[0]; }).join(", ");
      if (words) { body.appendChild(el("span", "k", "Key words")); body.appendChild(el("span", "", words)); }
      ls.practice.forEach(function (p) {
        var q = el("div", "q", p.q + "\n"), out = el("div", "");
        [["hint", p.hint], ["answer", p.solution]].forEach(function (pair) {
          var b = el("button", "", t(pair[0])); b.type = "button";
          b.onclick = function () { out.textContent = pair[1]; };
          q.appendChild(b);
        });
        q.appendChild(out); body.appendChild(q);
      });
      var ask = el("button", "say", t("explain")); ask.type = "button"; ask.style.marginTop = "10px";
      ask.onclick = function () { tab("chat"); $("text").value = t("explain") + ": " + ls.title; $("text").focus(); };
      body.appendChild(ask);
      card.appendChild(head); card.appendChild(body); root.appendChild(card);
    });
  }

  function paintWords() {
    var f = ($("find").value || "").toLowerCase(), list = $("wordlist"); list.innerHTML = "";
    pack.glossary.forEach(function (w) {
      var hay = (w.en + " " + w.local + " " + w.definition).toLowerCase();
      if (f && hay.indexOf(f) < 0) return;
      var d = el("div", "word"); d.appendChild(el("b", "", w.local ? w.local + " " : w.en + " "));
      if (w.local) d.appendChild(el("span", "tag", "(" + w.en + ") "));
      d.appendChild(el("div", "", w.definition)); list.appendChild(d);
    });
  }
  $("find").oninput = function () { if (pack) paintWords(); };

  function tab(name) {
    var bs = document.querySelectorAll("nav button");
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-selected", bs[i].getAttribute("data-tab") === name ? "true" : "false");
    ["chat", "learn", "words"].forEach(function (id) { $(id).hidden = id !== name; });
    $("composer").hidden = name !== "chat";
  }
  var navs = document.querySelectorAll("nav button");
  for (var i = 0; i < navs.length; i++) navs[i].onclick = function () { tab(this.getAttribute("data-tab")); };

  // ----- Settings
  var sel = $("lang");
  Object.keys(LANGS).forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = LANGS[k]; sel.appendChild(o); });
  sel.value = lang;
  sel.onchange = function () { lang = this.value; store("lang", lang); paintUI(); loadPack(); };
  $("saver").checked = store("saver") === "1" || !!(navigator.connection && (navigator.connection.saveData || /2g/.test(navigator.connection.effectiveType || "")));
  $("saver").onchange = function () { store("saver", this.checked ? "1" : "0"); };
  $("newchat").onclick = function () { sessionId = ""; store("sid", ""); $("log").innerHTML = ""; bubble(t("welcome"), "bot"); };

  window.addEventListener("online", function () { paintNet(); flush(); });
  window.addEventListener("offline", paintNet);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});

  paintUI(); meter(0); bubble(t("welcome"), "bot"); loadPack(); flush();
  if (/^#(learn|words)$/.test(location.hash)) tab(location.hash.slice(1));  // deep links, e.g. from an SMS
})();
</script>
</body>
</html>
